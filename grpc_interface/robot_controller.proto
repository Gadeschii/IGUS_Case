syntax = "proto3";

package robot;
option python_package = "grpc_interface";

service RobotController {
  rpc ConectingSequence (Empty) returns (Status);
  rpc Reference (Empty) returns (Status);
  rpc ImportVariables (Empty) returns (Status);
  rpc StartSequence (Empty) returns (Status);
  rpc Stop (Empty) returns (Status);
  rpc GetState (Empty) returns (Status);
}

message Empty {}

message Status {
  string message = 1;
  bool success = 2;
}
